[package]
name = "dozer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dozer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
dirs = "5"
sysinfo = "0.32"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap_complete = { version = "4.6.5", features = ["unstable-dynamic"] }
