[workspace]
resolver = "3"
members = ["crates/*", "spike/*"]

# Dozer 本地补丁：`iced_font_awesome` 上游把 umbrella `iced` 以 default 特性依赖，
# 其 default 里的 `web-colors` 会经特性联合打开共享 `iced_graphics::GAMMA_CORRECTION`
# =false，整窗 Secondary gamma 灰白发灰。这里用 `vendor/` 里的本地副本替换注册表源，
# 副本已把 `iced` 依赖设为 `default-features = false`。
[patch.crates-io]
iced_font_awesome = { path = "vendor/iced_font_awesome" }

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
portable-pty = "0.8"
alacritty_terminal = "0.26"
