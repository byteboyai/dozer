[workspace]
resolver = "3"
members = ["crates/*", "spike/*"]
# v2-excalidraw 自带 [workspace],不进主锁文件。
# bytehost-* 已拆到独立仓库 byteboyai/bytehost,消费方按 tag 引用(见
# docs/superpowers/specs/2026-10-08-bytehost-a7-acceptance-report.md)。
exclude = ["spike/v2-excalidraw", "spike/browser-probe", "spike/dozer-browser-exposure"]


[workspace.package]
edition = "2024"
license = "MIT"

# 发布体积优化(2026-09-18):默认 release profile 什么都不开,打包出的
# dozer GUI 二进制 51M。开 LTO + 单 codegen 单元 + opt-level=s + strip
# 实测降到 24M(-53%),daemon/mcp/hook 同比例收缩。打包编译时间变长
# (约 1m16s -> 3m47s),但这是发布链路、不是日常 dev 链路,可接受。
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
portable-pty = "0.8"
alacritty_terminal = "0.26"
tokio-tungstenite = "0.24"
futures-util = "0.3"
libc = "0.2"
cargo_metadata = "0.19"
petgraph = "0.8"

# bytehost 共享宿主层:tag 只在这里钉一次,消费 crate 用 `.workspace = true`,
# 需要额外 feature 的在消费方写 `{ workspace = true, features = [...] }`(features 会与这里合并)。
# 升级 bytehost 时只改这一段。
bytehost-apps = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.18" }
bytehost-client = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.18" }
bytehost-core = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.18" }
bytehost-desktop = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.18" }
bytehost-panel = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.18" }
bytehost-webview = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.18" }
# 共享设置层:v0.4.18 起可用;dozer 消费设置窗时用 `.workspace = true`
# (未使用的 workspace 依赖不进依赖图,不影响构建)。
bytehost-chrome = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.18" }
bytehost-settings = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.18" }
bytehost-settings-ui = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.18" }
