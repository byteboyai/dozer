[workspace]
resolver = "3"
members = ["crates/*", "spike/*"]
# origin-gateway 是 bytehost 应用宿主的一次性 origin 验证(自带 [workspace],不进主锁文件)
# plantuml-js 是文件预览 PlantUML 的 Node/JS 引擎 spike(npm 工程,无 Cargo.toml)
exclude = ["spike/origin-gateway", "spike/plantuml-js", "spike/v2-excalidraw"]

[workspace.package]
edition = "2024"
license = "MIT"

# 发布体积优化(2026-09-18):默认 release profile 什么都不开,打包出的
# dozer GUI 二进制 51M。开 LTO + 单 codegen 单元 + opt-level=s + strip
# 实测降到 24M(-53%),daemon/mcp/hook 同比例收缩。打包编译时间变长
# (约 1m16s -> 3m47s),但这是发布链路、不是日常 dev 链路,可接受。
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
portable-pty = "0.8"
alacritty_terminal = "0.26"
tokio-tungstenite = "0.24"
futures-util = "0.3"
libc = "0.2"
cargo_metadata = "0.19"
petgraph = "0.8"
