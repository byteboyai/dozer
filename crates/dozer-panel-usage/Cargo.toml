[package]
name = "dozer-panel-usage"
version = "0.1.0"
edition.workspace = true
publish = false

# 同源 Usage 面板库(Task 19):Dozer 与 Digger 共用的数据层/视图层/web 资源。
# 依赖闭包刻意**不含** dozer-app / dozer-client / dozer-core(见计划 §Task 19):
# 领域 model/services 与公共 UI 允许,产品专属语义经注入的适配器提供。
[dependencies]
dozer-model = { path = "../dozer-model" }
dozer-services = { path = "../dozer-services" }
# 纯 i18n 解析库(只依赖 dozer-model + serde),不引入 dozer-app/client/core。
dozer-i18n = { path = "../dozer-i18n" }
byteui = { git = "https://github.com/byteboyai/byteui", tag = "v0.4.5" }
# Surface 是公共机制(bytehost-core/desktop),产品只给策略与资源;不在库里复刻 wry 初始化。
bytehost-core = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.9" }
bytehost-desktop = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.9" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
iced_widget = { version = "0.14", features = ["canvas", "svg"] }
iced_renderer = "0.14"

[dev-dependencies]
tempfile = "3"
