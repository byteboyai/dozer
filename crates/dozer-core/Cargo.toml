[package]
name = "dozer-core"
version = "0.1.0"
edition.workspace = true

[features]
# `tracing` 后端(`log::init`/`log_*!`)。默认关:`dozer-hook`/`dozer-mcp` 不能被拉进
# tracing,它们只用 `log` 里始终编译的纯 std 部分。
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]

[dependencies]
anyhow.workspace = true
# 应用宿主的线上类型(默认 feature:只有 serde 依赖,`dozer-hook`/`dozer-mcp` 的依赖闭包不会因此多出新 crate)
bytehost-apps = { git = "https://github.com/byteboyai/bytehost", tag = "v0.1.1" }
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
