<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src dozer: data:; media-src dozer:; style-src 'unsafe-inline' dozer:; font-src dozer: data:; connect-src 'self'; frame-src 'self' dozer:; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Dozer HTML 预览</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0e16; }
      html[data-theme='light'] body { background: #ffffff; }
      #view { border: 0; width: 100%; height: 100%; display: block; background: transparent; }
      #msg { font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; color: #ffb4a2; padding: 16px; }
    </style>
  </head>
  <body>
    <!-- T7 隔离 host:把绑定 HTML 放进**无脚本**sandbox iframe(sandbox 只放行
         allow-same-origin,不放行 allow-scripts——脚本仍然完全禁跑,`<base>`
         指向文件所在目录,让相对 css/js/图片经同一 dozer://html/__file__ 白名单
         端点解析;无网络。Rust 侧只对"已打开文件所在目录子树"放行(见
         assets::serve_html_file)。

         2026-09-27 修订:最初 sandbox="" 不带 allow-same-origin,srcdoc 文档
         拿到的是唯一 opaque origin——WebKit(macOS WKWebView)在这个组合下,
         注入的 `<base>` 标签不会覆盖相对 URL 解析的 fallback base,相对 css/js/
         图片请求解析不到 `dozer://html/__file__/...`,导致预览"只有文字没有
         样式"(同源 Chromium 引擎下不复现,是 WebKit 特有行为,可查
         whatwg/html#9025)。补回 allow-same-origin 后,文档 origin = 本 host 的
         `dozer://html` origin,`<base>` 按预期生效;因为 allow-scripts 仍未放行,
         被预览的 HTML 拿到"同源"也无法执行任何脚本去利用它,不引入新风险
         (真正的沙盒逃逸手法要 allow-scripts + allow-same-origin 同时具备)。 -->
    <iframe id="view" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe>
    <div id="msg" hidden></div>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var p = q.get('p') || '';
        var theme = q.get('theme') === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var frame = document.getElementById('view');
        var msg = document.getElementById('msg');
        var encPath = p.split('/').map(encodeURIComponent).join('/');
        var fileUrl = 'dozer://html/__file__' + encPath;
        var dir = fileUrl.slice(0, fileUrl.lastIndexOf('/') + 1);
        var base = '<base href="' + dir + '">';
        function withBase(html) {
          if (/<head[^>]*>/i.test(html)) {
            return html.replace(/<head[^>]*>/i, function (m) { return m + base; });
          }
          return base + html;
        }
        // T8:HTML host → Rust 的统一 envelope 桥。项目/面板/tab/doc 由 Rust 写进
        // URL 查询串,host 原样带回给 Rust 校验归属(JS 不能自报)。事件只走这个
        // 具名通道,与 flyfish/editor/json-editor 的 payload 分开。
        function envelope(payload) {
          return JSON.stringify({
            protocol_version: 1,
            project_id: Number(q.get('proj') || 0) || 0,
            panel: q.get('panel') || 'files',
            tab_id: Number(q.get('tab') || 0) || 0,
            document_id: q.get('doc') || '',
            revision: 0,
            request_id: null,
            payload: payload,
          });
        }
        function post(payload) {
          try {
            window.ipc.postMessage(envelope(payload));
          } catch (_) {}
        }
        post({ kind: 'ready' });
        // 正文可见边界:iframe `load` 在 srcdoc 文档(含相对资源)加载完成后触发。
        // Rust 侧收到 `document_loaded` 才把这个原生子视图设为可见并结束 loading。
        // 注意:静态 iframe 挂载时会先为 about:blank 触发一次 `load`,必须在真正
        // 写入 `srcdoc` 之后才认(否则会在空白文档上提前宣告就绪)。
        var docSet = false;
        frame.addEventListener('load', function () {
          if (docSet) post({ kind: 'document_loaded' });
        });
        fetch(fileUrl)
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          })
          .then(function (text) {
            docSet = true;
            frame.srcdoc = withBase(text);
          })
          .catch(function (err) {
            frame.hidden = true;
            msg.hidden = false;
            msg.textContent = '无法读取 HTML 文件: ' + String(err);
            post({ kind: 'failed', message: '无法读取 HTML 文件: ' + String(err), recoverable: true });
          });
      })();
    </script>
  </body>
</html>
