[package]
name = "dozer-app"
version = "0.5.280"
edition.workspace = true

[[bin]]
name = "dozer"
path = "src/main.rs"

[features]
# 无 feature:CodeMirror editor host 常开(老 iced `CodeView` 已退役)。
default = []

[dependencies]
dozer-core = { path = "../dozer-core", features = ["logging"] }
dozer-client = { path = "../dozer-client" }
dozer-codehealth = { path = "../dozer-codehealth" }
# 复用 dozer-hook 的 hook 安装逻辑(install::run_at/opencode_install::run_at)，
# 新建 agent 会话时静默注册对应 CLI 的 hook，不必用户手动跑 `dozer-hook install`。
dozer-hook = { path = "../dozer-hook" }
# 新建 agent 会话时静默注册对应 CLI 的 dozer-mcp（第一个写工具 2026-08-27）。
dozer-mcp = { path = "../dozer-mcp" }
byteui = { git = "https://github.com/byteboyai/byteui", tag = "v0.4.1" }
bytegit = { git = "https://github.com/byteboyai/bytegit", tag = "v0.7.0", features = ["watch"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
iced_winit = "0.14"
iced_wgpu = { version = "0.14", default-features = true }
iced_widget = { version = "0.14", features = ["wgpu", "canvas", "svg", "markdown", "highlighter", "image"] }
iced_renderer = "0.14"
winit = "0.30"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
futures = { version = "0.3", features = ["thread-pool"] }
tracing.workspace = true
alacritty_terminal.workspace = true
wry = "0.55.1"
rfd = "0.15"
trash = "5.2.6"
arboard = "3"
png = "0.17"
uuid.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "postgres", "mysql", "sqlite", "uuid", "chrono", "json", "rust_decimal"] }
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
# keyring：数据库面板(extensions::database)与 SSH 面板(extensions::ssh)
# 共用同一个依赖，两边独立开发时各自加过一次，合并时按较新的 4.x 统一
# （v3→v4 无功能性 API 变化，`Entry::new`/`set_password`/`get_password`/
# `delete_credential` 签名不变，纯粹是内部 credential store 选择机制调整）。
keyring = "4.1.6"
# reqwest：Git 账户设置(extensions::settings)校验 PAT 用的异步 HTTP 客户端。
# 走 rustls-tls 与 sqlx/mongodb/russh-sftp 一致，不引入 OpenSSL。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# gleisbau = 原生 git 提交图布局库,嵌入 iced Canvas(已转正,非 spike)。
# git 读写统一走 bytegit(见上);这里不直接依赖 git2——gleisbau 与 bytegit 都要求 `git2 = "0.21"`
# (无默认 feature),cargo 会统一成同一份。
gleisbau = "0.7"
russh = "0.62.5"
# SFTP 客户端(阶段 3):在 russh channel 上跑 SFTP 子系统,查过 docs.rs
# 确认 2.4.0 的公开 API(SftpSession::new(stream)/read_dir/read/write/
# create_dir)与本项目 russh 0.62 线可以直接搭配(russh_sftp::client::
# SftpSession::new 只要求 stream 满足 AsyncRead+AsyncWrite+Unpin+Send+
# 'static,不绑定具体 russh 版本)。
russh-sftp = "2.4"
# url：数据库面板"直接粘贴连接 URI"解析用(已是 workspace 传递依赖,无新增编译物)。
url = "2"
# IME 组字预览(preedit)渲染时按字符实际显示宽度(CJK 占 2 格)定位,
# 已是传递依赖(cosmic-text/alacritty_terminal 链上),这里直接依赖用其
# 公开 API,不引入新版本解析。
unicode-width = "0.2"
# sysinfo：footbar 系统信息条(CPU/RAM/网络/磁盘)的统一数据源。
sysinfo = "0.32"
# ripgrep 搜索内核(纯 Rust),用于文件树右键"搜索"弹窗的全文内容搜索。
# 直接依赖 grep-searcher + grep-regex 做匹配(grep 伞 crate 本身没被
# `use` 过,2026-08-12 经 cargo-machete 核实后移除)。
# ignore 的 `WalkBuilder::build_parallel` 做多核并行遍历(每 worker 线程各持
# 一个 Searcher),取代早期"串行遍历收集路径 + 逐个串行 search_path"的单核实现。
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4"
# memchr：大文件窗口化"整文件搜索"的分段有界扫描(超长单行不能整行读入,
# 见 preview/large_text.rs::stream_search)。已是 grep-searcher 的传递依赖。
memchr = "2"
# calamine：表格预览(Tabular Viewer)解析 .xls/.xlsx/.ods,`dates` feature
# 打开 chrono 日期值供单元格日期格式化(见 tabular::data_to_string)。
# csv：.csv/.tsv 的流式解析(引号/转义/参差行由它处理)。
calamine = { version = "0.36", features = ["dates"] }
csv = "1"

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile = "3"
# 面板单元测试用 `TempRepo` 造真实仓库。
bytegit = { git = "https://github.com/byteboyai/bytegit", tag = "v0.7.0", features = ["testutil"] }

# macOS 原生右键菜单(`native_menu`)在运行时把内嵌 Lucide SVG 栅格化成
# PNG 包成 NSImage,依赖 resvg/usvg/tiny-skia。三个 crate 已经是 iced_wgpu
# svg feature 的间接依赖(见 Cargo.lock 0.45.1/0.45.1/0.11.4),这里 pin 到
# 同一精确版本,避免引入重复编译;tiny-skia 开 `png` feature 供
# `encode_png()` 用(该 feature 也已由 iced_wgpu 链间接启用)。
[target.'cfg(target_os = "macos")'.dependencies]
resvg = "=0.45.1"
usvg = "=0.45.1"
tiny-skia = { version = "=0.11.4", features = ["png"] }
# 原生菜单项 hover 高亮:直接改 `CALayer.backgroundColor`(`NSView.layer()`
# 返回的 `CALayer`)。objc2-app-kit 只按自己所需的最小 feature 集间接拉
# `objc2-quartz-core`,拿不到完整 `CALayer` API(`setBackgroundColor`/
# `setCornerRadius` 编译期直接报"方法不存在"),显式声明成直接依赖并开
# `CALayer` feature 才能用;`Cargo.lock` 里已有同版本(0.3.2),pin 一致。
objc2-quartz-core = { version = "=0.3.2", features = ["CALayer"] }
# 预览 webview 的 ⌘F 兜底:页面内没有可聚焦的搜索框时,调 WKWebView 原生
# `findString:withConfiguration:completionHandler:` 弹出 macOS 系统查找条。
# 该 API 在 objc2-web-kit 里被 `WKFindConfiguration`+`WKFindResult`+`block2`
# 三个 feature 门控,wry 只开了 `WKWebView` 没开这两个,所以显式声明成直接
# 依赖并补全 feature(版本 0.3.2 与 wry 传递依赖一致,Cargo.lock 无新增)。
objc2-web-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-app-kit",
    "block2",
    "WKWebView",
    "WKFindConfiguration",
    "WKFindResult",
] }
# 预览 webview 原生查找条的 completion handler 用 `RcBlock` 构造(nil block
# 也要一个真实 block 对象)。版本与 objc2-web-kit 传递依赖一致。
block2 = "0.6"
