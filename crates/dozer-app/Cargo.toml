[package]
name = "dozer-app"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "dozer"
path = "src/main.rs"

[dependencies]
dozer-core = { path = "../dozer-core" }
dozer-client = { path = "../dozer-client" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
iced_winit = "0.14"
iced_wgpu = { version = "0.14", default-features = true }
iced_widget = { version = "0.14", features = ["wgpu", "canvas", "svg"] }
winit = "0.30"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
futures = { version = "0.3", features = ["thread-pool"] }
tracing.workspace = true
tracing-subscriber.workspace = true
alacritty_terminal.workspace = true
wry = "0.55.1"
rfd = "0.15"
trash = "5.2.6"
arboard = "3"
png = "0.17"
uuid.workspace = true
# spike(2026-08-06): 验证 gleisbau 作为原生 git 提交图布局库嵌入 iced Canvas
# 的可行性,见 docs/superpowers/plans 对应 spike 记录。若验证通过转正,再评估
# 是否需要 pin 具体版本/替换掉 git-graph CLI 同源代码库。
gleisbau = "0.7"
git2 = "0.21"
notify = "8"

[dev-dependencies]
tempfile = "3"
