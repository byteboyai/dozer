[package]
name = "dozer-app"
version = "0.3.5"
edition.workspace = true

[[bin]]
name = "dozer"
path = "src/main.rs"

[dependencies]
dozer-core = { path = "../dozer-core" }
dozer-client = { path = "../dozer-client" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
iced_winit = "0.14"
iced_wgpu = { version = "0.14", default-features = true }
iced_widget = { version = "0.14", features = ["wgpu", "canvas", "svg"] }
# `iced_renderer::Renderer`(fallback 枚举)是 dozer 全工程统一的 renderer 类型:
# `iced-code-editor` 经 umbrella `iced` crate 默认拉起 `iced_renderer/tiny-skia`,
# 把 `iced_renderer::Renderer` 固化为 `fallback::Renderer<wgpu, tiny_skia>` 枚举;
# Cargo feature 联合无法关掉 tiny-skia,所以 dozer 自己的 widget 树也必须改用
# 同一个枚举 renderer,才能把编辑器 widget 嵌进预览编辑弹层(否则类型不兼容)。
iced_renderer = "0.14"
# 本地 vendored 副本(见 `vendor/iced-code-editor`):打了补丁以暴露
# `set_syntax_theme`,让语法高亮 token 颜色也能换成 ByteBoy2077 配色
# (上游 0.3.11 把 syntect 主题硬编码成 base16-ocean.dark,无公开接口可改)。
iced-code-editor = { path = "../../vendor/iced-code-editor", version = "0.3" }
# 构造 Dozer 的 syntect 语法主题时复用与编辑器完全一致的 syntect 版本,
# 保证 `Theme` 类型对得上(`set_syntax_theme` 接收的就是这个类型)。
syntect = "5.3"
winit = "0.30"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
futures = { version = "0.3", features = ["thread-pool"] }
tracing.workspace = true
tracing-subscriber.workspace = true
alacritty_terminal.workspace = true
wry = "0.55.1"
rfd = "0.15"
trash = "5.2.6"
arboard = "3"
png = "0.17"
uuid.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "postgres", "mysql", "sqlite"] }
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
# keyring：数据库面板(extensions::database)与 SSH 面板(extensions::ssh)
# 共用同一个依赖，两边独立开发时各自加过一次，合并时按较新的 4.x 统一
# （v3→v4 无功能性 API 变化，`Entry::new`/`set_password`/`get_password`/
# `delete_credential` 签名不变，纯粹是内部 credential store 选择机制调整）。
keyring = "4.1.6"
# gleisbau = 原生 git 提交图布局库,嵌入 iced Canvas(已转正,非 spike)。
# git2 = git 数据层(git_log 提交图 + delivery 状态查询 + worktree 列表),
# 依赖版本与 gleisbau 传递依赖对齐,避免 cargo 拉两份。
# notify = 项目工作区实时文件系统监听(git_watch 的 debounce 基础)。
gleisbau = "0.7"
git2 = "0.21"
notify = "8"
russh = "0.62.5"
# url：数据库面板"直接粘贴连接 URI"解析用(已是 workspace 传递依赖,无新增编译物)。
url = "2"
# sysinfo：footbar 系统信息条(CPU/RAM/网络/磁盘)的统一数据源。
# 版本与 crates/legacy-boy 一致,workspace Cargo.lock 已热,不引入新版本解析。
sysinfo = "0.32"

[dev-dependencies]
tempfile = "3"
