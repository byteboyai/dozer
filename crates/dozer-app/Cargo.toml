[package]
name = "dozer-app"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "dozer"
path = "src/main.rs"

[dependencies]
dozer-core = { path = "../dozer-core" }
dozer-client = { path = "../dozer-client" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
iced_winit = "0.14"
iced_wgpu = { version = "0.14", default-features = true }
iced_widget = { version = "0.14", features = ["wgpu", "canvas", "svg"] }
winit = "0.30"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
futures = { version = "0.3", features = ["thread-pool"] }
tracing.workspace = true
tracing-subscriber.workspace = true
alacritty_terminal.workspace = true
wry = "0.55.1"
rfd = "0.15"
trash = "5.2.6"
arboard = "3"
png = "0.17"
uuid.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "postgres", "mysql", "sqlite"] }
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
keyring = "3"
# gleisbau = 原生 git 提交图布局库,嵌入 iced Canvas(已转正,非 spike)。
# git2 = git 数据层(git_log 提交图 + delivery 状态查询 + worktree 列表),
# 依赖版本与 gleisbau 传递依赖对齐,避免 cargo 拉两份。
# notify = 项目工作区实时文件系统监听(git_watch 的 debounce 基础)。
gleisbau = "0.7"
git2 = "0.21"
notify = "8"

[dev-dependencies]
tempfile = "3"
