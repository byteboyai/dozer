<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dozer Preview</title>
<style>
  /* 主题跟随 dozer(见下方 ?theme= 解析):body 底色与滚动条滑块用 CSS
     变量,脚本按 theme 设到 <html> 上。深色值与 byteboy2077 的 panel
     (#0a0e16)一致,浅色值与 byteboy2077_light 的 panel(#fef2e4)一致。 */
  html { --preview-bg: #0a0e16; --sb-thumb: rgba(255, 229, 180, 0.30);
         --sb-thumb-hover: rgba(255, 229, 180, 0.50); }
  html[data-theme="light"] { --preview-bg: #fef2e4; --sb-thumb: rgba(0, 0, 0, 0.24);
                             --sb-thumb-hover: rgba(0, 0, 0, 0.40); }
  html, body { margin: 0; height: 100%; background: var(--preview-bg); }
  flyfish-file-viewer { display: block; height: 100%; }
  /* 滚动条对齐 macOS 叠层样式:细、半透明、圆角,轨道透明不抢戏。
     Flyfish 的 .file-viewer-web-content / .image-viewer 用 overflow:auto
     且未上 shadow DOM,全局 ::-webkit-scrollbar 能穿透到这些滚动容器。 */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--sb-thumb) transparent;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background-color: var(--sb-thumb);
    border-radius: 999px;
    border: 3px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: var(--sb-thumb-hover);
  }
  ::-webkit-scrollbar-corner { background: transparent; }
</style>
<script src="./flyfish-file-viewer-web-full.iife.js"></script>
</head>
<body>
<script>
  // ?p= 携带百分号编码的绝对路径;viewer src 用相对 URL 指向同源
  // __file__ 端点,encodeURI 保留 '/' 与扩展名(Flyfish 靠扩展名选管线)。
  const params = new URLSearchParams(location.search);
  const p = decodeURIComponent(params.get('p') || '');
  // 主题跟随 dozer:URL 的 ?theme= 由 Rust 侧按当前配色方案传入(见
  // flyfish_url),缺省/异常值退回 dark,保持旧行为。
  const theme = params.get('theme') === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  const el = document.createElement('flyfish-file-viewer');
  el.setAttribute('src', '__file__' + encodeURI(p));
  el.setAttribute('theme', theme);
  el.setAttribute('toolbar', 'false');
  // 文本预览挂了 &ln=1(Rust 侧按扩展名白名单判定):开 flyfish text
  // 渲染器的行号栏。option 走 JSON 化的 attributes,与 theme/toolbar
  // 属性合并,图片/PDF 渲染器不认此 option,无副作用。
  if (new URLSearchParams(location.search).get('ln') === '1') {
    el.setAttribute('options', JSON.stringify({ text: { lineNumbers: true } }));
  }
  document.body.appendChild(el);
</script>
</body>
</html>
