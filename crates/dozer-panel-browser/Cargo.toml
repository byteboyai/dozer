[package]
name = "dozer-panel-browser"
version = "0.1.0"
edition.workspace = true
publish = false

# 同源浏览器面板库:Dozer 与 Digger 共用的页签 / 地址栏状态与文案。
# 依赖闭包刻意**不含** dozer-app / dozer-client / dozer-core / wry / winit:领域
# model/services、共享宿主件与公共 UI 允许,产品专属语义经注入的适配器提供。
[dependencies]
dozer-model = { path = "../dozer-model" }
dozer-services = { path = "../dozer-services" }
dozer-i18n = { path = "../dozer-i18n" }
dozer-panel-host = { path = "../dozer-panel-host" }
byteui = { git = "https://github.com/byteboyai/byteui", tag = "v0.4.6" }
bytehost-core = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.12" }
tokio.workspace = true
iced_widget = { version = "0.14", features = ["canvas", "svg"] }
iced_renderer = "0.14"
# 面板日志:库不许依赖 `dozer-core` 的 scope 宏,直接打 `tracing`,target 固定 `dozer::panel::web`。
tracing = "0.1"
