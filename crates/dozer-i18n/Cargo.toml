[package]
name = "dozer-i18n"
version = "0.1.0"
edition.workspace = true

# 纯 i18n 解析库(spec 2026-10-12-dozer-i18n-design §5):JSON 校验、纯查表、
# fallback、插值及 Rust/TS 共享测试向量。不承担持久化、iced、网络或插件进程
# 管理。依赖闭包刻意最小——只依赖 dozer-model 的数据类型 + serde。
[dependencies]
dozer-model = { path = "../dozer-model" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
