[package]
name = "byteui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iced_widget = { version = "0.14", features = ["svg", "canvas"] }
iced_renderer = "0.14"
iced_futures = { version = "0.14", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
