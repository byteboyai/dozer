[package]
name = "dozerd"
version = "0.3.3"
edition.workspace = true

[dependencies]
dozer-core = { path = "../dozer-core", features = ["logging"] }
# 应用宿主:`server` feature = gateway + AppManager(只有 dozerd 打开)
bytehost-apps = { git = "https://github.com/byteboyai/bytehost", tag = "v0.1.1", features = ["server"] }
bytegit = { git = "https://github.com/byteboyai/bytegit", tag = "v0.7.0" }
anyhow.workspace = true
tokio.workspace = true
portable-pty.workspace = true
uuid.workspace = true
serde_json.workspace = true
serde.workspace = true
toml = "0.9"
base64.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
libc.workspace = true
tempfile = "3"

[dev-dependencies]
dozer-client = { path = "../dozer-client" }
# 契约测试:UDS 实现要与进程内实现跑同一份断言。
bytehost-client = { git = "https://github.com/byteboyai/bytehost", tag = "v0.1.1", features = ["conformance"] }
uuid.workspace = true
