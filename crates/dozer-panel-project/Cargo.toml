[package]
name = "dozer-panel-project"
version = "0.1.0"
edition.workspace = true
publish = false

# 同源 Project 面板库(S5a):Dozer 与 Digger 共用的状态 / 更新 / 视图。
# 依赖闭包刻意**不含** dozer-app / dozer-client / dozer-core(见 spec §5):领域
# model/services、共享宿主件与公共 UI 允许,产品专属语义经注入的适配器提供。
[dependencies]
dozer-model = { path = "../dozer-model" }
dozer-services = { path = "../dozer-services" }
dozer-i18n = { path = "../dozer-i18n" }
dozer-panel-host = { path = "../dozer-panel-host" }
byteui = { git = "https://github.com/byteboyai/byteui", tag = "v0.4.5" }
bytehost-core = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.10" }
bytehost-desktop = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.10" }
# "修复项目"的 git init 步骤;与 dozer-app 用同一个 tag,保证图里只有一份 bytegit。
bytegit = { git = "https://github.com/byteboyai/bytegit", tag = "v0.8.1" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
iced_widget = { version = "0.14", features = ["canvas", "svg"] }
iced_renderer = "0.14"
trash = "5.2.6"
# 面板日志:产品侧(`dozer-core`)的 scope 宏搬不过来(库不许依赖它),
# 这里直接打 `tracing`,target 沿用 `dozer::panel::project`。
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# 只在测试构建里启用:默认 `iced_renderer` feature 下 `Renderer` 走 null 文本后端,
# `text_editor::Content::with_text` 读回来永远是空串,描述编辑的测试会假失败。
# 产品(dozer-app)本来就开 `wgpu`,这里不改变生产构建。
iced_widget = { version = "0.14", features = ["wgpu", "canvas", "svg"] }
