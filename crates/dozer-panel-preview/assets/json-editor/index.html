<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- 严格 CSP:脚本/样式仅 self,禁网络/frame/任意导航。vanilla-jsoneditor
         会动态注入内联 style,故 style-src 需 'unsafe-inline'(仅样式)。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dozer JSON</title>
    <link rel="stylesheet" href="json-editor.css" />
  </head>
  <body>
    <div id="json-editor-root"></div>
    <script src="json-editor.js"></script>
  </body>
</html>
