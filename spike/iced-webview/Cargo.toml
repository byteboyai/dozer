[package]
name = "spike-iced-webview"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
iced_winit = "0.14"
iced_wgpu = { version = "0.14", default-features = true }
iced_widget = { version = "0.14", features = ["wgpu"] }
winit = "0.30"
wry = "0.55.1"
futures = { version = "0.3", features = ["thread-pool"] }
tracing-subscriber = "0.3"
